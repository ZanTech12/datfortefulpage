<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="zGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGradient)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="5" y="5" width="90" height="90" rx="18" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Letter Z (Circuit Trace Style) -->
  <path d="M 20 30 L 45 30 L 20 70 L 45 70" stroke="url(#zGradient)" stroke-width="7" stroke-linejoin="round" stroke-linecap="butt"/>
  
  <!-- Circuit Nodes (Dots) on Z -->
  <circle cx="20" cy="30" r="4.5" fill="#67e8f9" />
  <circle cx="45" cy="30" r="4.5" fill="#67e8f9" />
  <circle cx="20" cy="70" r="4.5" fill="#67e8f9" />
  <circle cx="45" cy="70" r="4.5" fill="#67e8f9" />
  
  <!-- Letter A (Modern Geometric) -->
  <path d="M 55 70 L 67.5 30 L 80 70 M 59 50 L 76 50" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
</svg>